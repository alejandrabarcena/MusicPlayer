[project]
name = "welcome-classical-music"
version = "1.0.0"
description = "Welcome Classical Music - Desktop and Web Application"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "mutagen>=1.47.0",
    "numpy>=2.3.2",
    "pillow>=11.3.0",
    "pygame>=2.6.1",
    "requests>=2.32.5",
    "spotipy>=2.25.1",
    "werkzeug>=3.1.3",
]

[project.scripts]
welcome-classical-music = "main:main"
